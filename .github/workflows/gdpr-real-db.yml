name: gdpr-real-db

# Runs the real-Postgres regression suites against an ephemeral cluster
# with every supabase/migrations/*.sql applied. Two suites share this job:
#   1. tests/leak-suite/gdpr-roundtrip-realdb.test.ts — pins
#      delete_user_data() per-table coverage (catches typo'd table names,
#      broken function bodies, missing FK cascades, RLS that blocks the
#      delete). Companion mock: tests/leak-suite/gdpr-roundtrip.test.ts.
#   2. tests/leak-suite/cap-race-realdb.test.ts (task #19) — pins the
#      per-day cap SQL trio (reserve_inference_slot /
#      finalize_inference_usage / release_inference_slot) against the real
#      advisory lock + status filter + stale-pending sweep. Companion
#      mock: tests/leak-suite/cap-race.test.ts.
# Both are gated on GDPR_REAL_DB_URL so the offline `bun run test` path
# stays green; here that URL is exported by scripts/test-gdpr-real-db.sh.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "src/lib/gdpr.functions.ts"
      - "src/server/inference/chat.ts"
      - "tests/leak-suite/gdpr-roundtrip*"
      - "tests/leak-suite/cap-race-realdb.test.ts"
      - "tests/leak-suite/fixtures/auth-shim.sql"
      - "scripts/test-gdpr-real-db.sh"
      - ".github/workflows/gdpr-real-db.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/lib/gdpr.functions.ts"
      - "src/server/inference/chat.ts"
      - "tests/leak-suite/gdpr-roundtrip*"
      - "tests/leak-suite/cap-race-realdb.test.ts"
      - "tests/leak-suite/fixtures/auth-shim.sql"
      - "scripts/test-gdpr-real-db.sh"
      - ".github/workflows/gdpr-real-db.yml"
  workflow_dispatch:

jobs:
  gdpr-real-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # We use system postgres directly (initdb + pg_ctl in a temp dir) rather
      # than the `services: postgres` block, because the script needs to apply
      # the auth-schema shim BEFORE migrations and a service container is
      # already initialized by the time the job starts.
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Run real-Postgres regressions (gdpr-roundtrip + cap-race)
        run: bash scripts/test-gdpr-real-db.sh
